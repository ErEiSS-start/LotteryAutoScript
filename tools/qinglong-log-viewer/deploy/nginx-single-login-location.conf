# 可选：放在主域名的 server 块中，让副服务器复用主域名的 Basic Auth。
location = /log-viewer-2 {
    return 301 /log-viewer-2/;
}

location ^~ /log-viewer-2/ {
    proxy_set_header Host qinglong2.example.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_ssl_server_name on;
    proxy_ssl_name qinglong2.example.com;
    proxy_pass https://qinglong2.example.com/log-viewer/;
}
