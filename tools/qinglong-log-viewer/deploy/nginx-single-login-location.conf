# 可选：放在主域名的 server 块中，让副服务器复用主域名的登录会话。
# 请把 192.0.2.10 和 qinglong2.example.com 分别替换为副服务器 IPv4 与域名。
location = /log-viewer-2 {
    return 301 /log-viewer-2/;
}

location ^~ /log-viewer-2/ {
    proxy_set_header Host qinglong2.example.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-QLV-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_ssl_server_name on;
    proxy_ssl_name qinglong2.example.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass https://192.0.2.10/log-viewer/;
}

location = /winner-reminders-2 {
    return 301 /winner-reminders-2/;
}

location ^~ /winner-reminders-2/ {
    proxy_set_header Host qinglong2.example.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-QLV-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_ssl_server_name on;
    proxy_ssl_name qinglong2.example.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass https://192.0.2.10/winner-reminders/;
}
